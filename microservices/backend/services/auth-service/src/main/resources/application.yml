server:
  port: 8081
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:true}
        http-only: ${SERVER_SERVLET_SESSION_COOKIE_HTTP_ONLY:true}
        same-site: ${SERVER_SERVLET_SESSION_COOKIE_SAME_SITE:Lax}

spring:
  application:
    name: resume-auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resume_auth}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/auth_nodup
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:https://localhost:8443}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS}

app:
  platform:
    middleware:
      timeout:
        enabled: ${APP_PLATFORM_TIMEOUT_ENABLED:true}
      retry:
        enabled: ${APP_PLATFORM_RETRY_ENABLED:true}
      circuit:
        enabled: ${APP_PLATFORM_CIRCUIT_ENABLED:true}
      idempotency:
        enabled: ${APP_PLATFORM_IDEMPOTENCY_ENABLED:true}
      telemetry:
        enabled: ${APP_PLATFORM_TELEMETRY_ENABLED:true}
        request-id-header: ${APP_PLATFORM_REQUEST_ID_HEADER:X-Request-Id}
        trace-id-header: ${APP_PLATFORM_TRACE_ID_HEADER:X-Trace-Id}
  cors:
    allowed-origins:
      - ${APP_CORS_ALLOWED_ORIGINS:https://localhost:4200}
  outbox:
    enabled: true
  search:
    elasticsearch:
      enabled: false
  restore:
    mail:
      enabled: ${APP_RESTORE_MAIL_ENABLED:true}
  services:
    profile:
      mode: remote
      base-url: ${PROFILE_SERVICE_URL:https://localhost:8082}
      service-jwt:
        token-uri: ${AUTH_INTERNAL_TOKEN_URI:http://localhost:8081/oauth2/token}
        client-id: ${AUTH_INTERNAL_CLIENT_ID:resume-profile-internal}
        client-secret: ${AUTH_INTERNAL_CLIENT_SECRET}
        scope: ${AUTH_INTERNAL_CLIENT_SCOPE:internal.profile}
      mtls:
        enabled: ${AUTH_INTERNAL_MTLS_ENABLED:true}
        key-store-path: ${AUTH_INTERNAL_MTLS_KEYSTORE_PATH:}
        key-store-password: ${AUTH_INTERNAL_MTLS_KEYSTORE_PASSWORD:}
        key-store-type: ${AUTH_INTERNAL_MTLS_KEYSTORE_TYPE:PKCS12}
        trust-store-path: ${AUTH_INTERNAL_MTLS_TRUSTSTORE_PATH:}
        trust-store-password: ${AUTH_INTERNAL_MTLS_TRUSTSTORE_PASSWORD:}
        trust-store-type: ${AUTH_INTERNAL_MTLS_TRUSTSTORE_TYPE:PKCS12}
  security:
    session:
      enabled: false
    remember-me:
      key: ${APP_SECURITY_REMEMBER_ME_KEY}
      secure-cookie: ${APP_SECURITY_REMEMBER_ME_SECURE_COOKIE:true}
    jwt:
      enabled: true
    csrf:
      cookie:
        same-site: ${APP_SECURITY_CSRF_COOKIE_SAME_SITE:Lax}
        secure: ${APP_SECURITY_CSRF_COOKIE_SECURE:true}
    login-protection:
      enabled: ${AUTH_LOGIN_PROTECTION_ENABLED:true}
      max-failed-attempts-before-lockout: ${AUTH_LOGIN_MAX_FAILED_ATTEMPTS_BEFORE_LOCKOUT:5}
      reset-window: ${AUTH_LOGIN_RESET_WINDOW:PT30M}
      initial-backoff: ${AUTH_LOGIN_INITIAL_BACKOFF:PT30S}
      max-backoff: ${AUTH_LOGIN_MAX_BACKOFF:PT30M}
    oidc:
      enabled: true
      issuer: ${AUTH_ISSUER_URI:https://localhost:8443}
      client-id: ${AUTH_CLIENT_ID:resume-spa}
      redirect-uri: ${AUTH_REDIRECT_URI:https://localhost:4200/auth/callback}
      post-logout-redirect-uri: ${AUTH_POST_LOGOUT_REDIRECT_URI:https://localhost:4200/}
      access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT10M}
      internal-client:
        client-id: ${AUTH_INTERNAL_CLIENT_ID:resume-profile-internal}
        client-secret: ${AUTH_INTERNAL_CLIENT_SECRET}
        scope: ${AUTH_INTERNAL_CLIENT_SCOPE:internal.profile}
        access-token-ttl: ${AUTH_INTERNAL_ACCESS_TOKEN_TTL:PT2M}
      signing-key:
        rotation-interval: ${AUTH_SIGNING_KEY_ROTATION_INTERVAL:PT24H}
        token-ttl: ${AUTH_SIGNING_KEY_TOKEN_TTL:${AUTH_ACCESS_TOKEN_TTL:PT10M}}
        clock-skew: ${AUTH_SIGNING_KEY_CLOCK_SKEW:PT1M}
        encryption-key: ${AUTH_SIGNING_KEY_ENCRYPTION_KEY}
